;Here we place an .ini-format config file
;The general format is:

;[object1_name]
;name1 = val1
;name2 = val2

;[object2_name]
;enable_serial_debug = true
;pin = 7
;ip = 192.168.1.1
;subdevice_list = child1_name,child2_name
;etcetera etcetera

;I would like to use YML or some other format, but I haven't found a library I like yet.
;ini works for now:
; - it has section breaks
; - it allows comments
; - the library for it is very good.

[bmp280]
enable_serial_debug = true

[fuel_gauge]
enable_serial_debug = true

[mqtt_client]
wifi_network_name = WifiNetworkNamePlaceholder
wifi_password = passwordPlaceholder
mqtt_client_name = ESP32_Client
mqtt_username = beluga
mqtt_password = beluga_mqtt
mqtt_server_address = broker.hivemq.com
;mqtt_server_address = 192.168.86.26
mqtt_server_port = 1883
rx_topics = weather_station/control/led_setpoint
tx_topics = weather_station/sense/battery_status,weather_station/sense/datetime,weather_station/sense/uptime_ms
[rtc]
enable_serial_debug = true

[deepsleep]
enable_serial_debug = true
enabled = true
deepsleep_immediately_when_triggered = true
wake_duration_mode = n_iterations
wake_duration = 20
sleep_duration_s = 20
enable_wake_button = false
wake_button_pin_number = 27
