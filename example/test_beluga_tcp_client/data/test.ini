;Here we place an .ini-format config file
;The general format is:

;[object1_name]
;name1 = val1
;name2 = val2

;[object2_name]
;enable_serial_debug = true
;pin = 7
;ip = 192.168.1.1
;subdevice_list = child1_name,child2_name
;etcetera etcetera


[tcp_client1]
enable_serial_debug = true
device_type = tcp_client
wifi_connection_name = wifi_connection1
server_ip = 192.168.1.5
port_number = 7788

[wifi_connection1]
enable_serial_debug = true
device_type = wifi_connection
wifi_network_name = beluga_wifi
wifi_password = beluga_password1
connect_automatically = true
max_connection_attempts = 50

