;Here we place an .ini-format config file
;The general format is:

;[object1_name]
;name1 = val1
;name2 = val2

;[object2_name]
;enable_serial_debug = true
;pin = 7
;ip = 192.168.1.1
;subdevice_list = child1_name,child2_name
;etcetera etcetera

;I would like to use YML or some other format, but I haven't found a library I like yet.
;ini works for now:
; - it has section breaks
; - it allows comments
; - the library for it is very good.



[machinery_mqtt_nexus_demo]
enable_serial_debug = true
app_name = demo
subdevice_names = thread1,thread2,buffAB,buffBA
thread_names = thread1,thread2
buffer_names = buffAB,buffBA

[thread1]
device_type = thread
enable_serial_debug = true
task_name = task1
task_core = 0
stack_size_bytes = 30001
subdevice_names= nexus1_comms

[thread2]
device_type = thread
enable_serial_debug = false
task_name = task2
task_core = 1
stack_size_bytes = 30001
subdevice_names= nexus2_work

[buffAB]
enable_serial_debug = true
device_type = interthread_buffer
buffer_size = 4095

[buffBA]
enable_serial_debug = true
device_type = interthread_buffer
buffer_size = 4095

[nexus1_comms]
enable_serial_debug = true
device_type = mqtt_nexus
comms_period_ms = 1000
subdevice_names = this_mqtt_client

[nexus2_work]
enable_serial_debug = true
device_type = nexus
comms_period_ms = 666

[this_mqtt_client]
device_type = mqtt_client
mqtt_client_name = ESP32_Client723
mqtt_username = ""
mqtt_password = ""
mqtt_server_address = broker.hivemq.com
rx_topics = beluga/esp32/mqtt_nexus_rx
tx_topics = beluga/esp32/mqtt_nexus_tx
wifi_network_name = WifiNetworkNamePlaceholder
wifi_password = passwordPlaceholder
mqtt_server_port = 1883
